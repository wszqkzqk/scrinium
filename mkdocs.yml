site_name: Scrinium
site_description: Scrinium — a research infrastructure for AI agents (hard fork of ScholarAIO)
site_url: https://wszqkzqk.github.io/scrinium/
repo_url: https://github.com/wszqkzqk/scrinium
repo_name: wszqkzqk/scrinium

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Agent Setup: getting-started/agent-setup.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Architecture: guide/architecture.md
      - CLI Reference: guide/cli-reference.md
      - Search & Browse: guide/search.md
      - Insights: guide/insights.md
      - Translation: guide/translate.md
      - Scientific Tool Onboarding: guide/toolref-onboarding.md
      - Ingestion: guide/ingestion.md
      - Writing: guide/writing.md
      - Webtools Integration: guide/webtools-integration.md
  - API Reference: api/index.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
