publisher: ZimoLiao
repo: wszqkzqk/scrinium
description: "Academic research skills for AI agents — literature search, paper analysis, citation management, academic writing, and more. Built for Scrinium."
keywords:
  - academic
  - research
  - literature
  - citations
  - papers
  - scholarship
  - literature-review
  - systematic-review
  - bibtex

skills:
  - name: scrinium/search
    path: .claude/skills/search
    description: "Search academic papers via FTS5 keyword search with an agent query-expansion protocol (multi-reformulation, tag filters, citation snowballing)"

  - name: scrinium/show
    path: .claude/skills/show
    description: "View paper content at any depth: metadata, abstract, conclusion, or full text (L1-L4)"

  - name: scrinium/ingest
    path: .claude/skills/ingest
    description: "Ingest papers, patents, theses, and documents from inbox into the knowledge base via the MinerU pipeline, and resolve pending items held for review"

  - name: scrinium/enrich
    path: .claude/skills/enrich
    description: "Enrich paper metadata: agent-written L3 conclusions via subagent deep reading, rule-based TOC extraction, abstract backfill (regex + DOI fetch)"

  - name: scrinium/index
    path: .claude/skills/index
    description: "Rebuild the FTS5 full-text search index after metadata changes or direct meta.json edits"

  - name: scrinium/topics
    path: .claude/skills/topics
    description: "Browse topic distribution via curated tags — tag-topic overview, drill into a topic's papers, hand off untagged papers to curation, chart via /draw"

  - name: scrinium/explore
    path: .claude/skills/explore
    description: "Explore literature by fetching papers from OpenAlex with multi-dimensional filters"

  - name: scrinium/graph
    path: .claude/skills/graph
    description: "Query citation graphs — references, citing papers, shared references"

  - name: scrinium/citations
    path: .claude/skills/citations
    description: "View top-cited papers ranking and refetch citation counts from APIs"

  - name: scrinium/export
    path: .claude/skills/export
    description: "Export papers to BibTeX, RIS, Markdown reference lists, or DOCX documents"

  - name: scrinium/import
    path: .claude/skills/import
    description: "Import papers from Endnote XML/RIS or Zotero (Web API or local SQLite)"

  - name: scrinium/workspace
    path: .claude/skills/workspace
    description: "Manage workspace paper subsets — create, add/remove papers, search, export BibTeX"

  - name: scrinium/rename
    path: .claude/skills/rename
    description: "Rename paper directories to standardized Author-Year-Title format"

  - name: scrinium/audit
    path: .claude/skills/audit
    description: "Audit paper data quality with per-issue fix hints; agent/subagents verify against the original text and repair meta.json directly"

  - name: scrinium/literature-review
    path: .claude/skills/literature-review
    description: "Write a literature review based on workspace papers: topic organization, narrative, gap identification"

  - name: scrinium/paper-writing
    path: .claude/skills/paper-writing
    description: "Assist writing research paper sections (Intro, Related Work, Method, Results, Discussion, Conclusion)"

  - name: scrinium/citation-check
    path: .claude/skills/citation-check
    description: "Verify citations in AI-generated text against local knowledge base and external APIs"

  - name: scrinium/writing-polish
    path: .claude/skills/writing-polish
    description: "Polish academic writing — remove AI patterns, improve clarity, match target journal style"

  - name: scrinium/review-response
    path: .claude/skills/review-response
    description: "Draft point-by-point responses to peer review comments with evidence from workspace papers"

  - name: scrinium/research-gap
    path: .claude/skills/research-gap
    description: "Identify research gaps and open questions from literature in a workspace"

  - name: scrinium/metrics
    path: .claude/skills/metrics
    description: "View runtime timing metrics — pipeline step durations, API call timing, search/read event history"

  - name: scrinium/insights
    path: .claude/skills/insights
    description: "Analyze research behavior — search hot keywords, most-read papers, reading trends — plus an agent unread-recommendation workflow (tag overlap + citation snowball)"

  - name: scrinium/draw
    path: .claude/skills/draw
    description: "Generate diagrams (Mermaid flowcharts, sequence, ER, Gantt, mind maps) and vector graphics (cli-anything-inkscape)"

  - name: scrinium/document
    path: .claude/skills/document
    description: "Generate Office documents (DOCX, PPTX, XLSX) via python-docx, python-pptx, and openpyxl APIs"

  - name: scrinium/setup
    path: .claude/skills/setup
    description: "Initialize and diagnose the Scrinium environment; bilingual EN/ZH setup wizard"

  - name: scrinium/arxiv
    path: .claude/skills/arxiv
    description: "Browse arXiv preprints, search arXiv directly, fetch a PDF by arXiv ID or URL, or send a preprint into the ingest pipeline"

  - name: scrinium/curate
    path: .claude/skills/curate
    description: "Curate papers with tags in batch — build a healthy tag vocabulary, tag untagged papers via subagents, review vocabulary quality"

  - name: scrinium/translate
    path: .claude/skills/translate
    description: "Translate paper markdown via agent-orchestrated chunked translation with glossary reuse and resume support, preserving LaTeX formulas, code blocks, and images"

  - name: scrinium/bioinformatics
    path: .claude/skills/bioinformatics
    description: "Bioinformatics toolchains: alignment, variant calling, phylogenetics, protein-structure analysis (BLAST, minimap2, samtools, bcftools, MAFFT, IQ-TREE, ESMFold)"

  - name: scrinium/gromacs
    path: .claude/skills/gromacs
    description: "Biomolecular molecular dynamics with GROMACS: system setup, equilibration, production runs, trajectory analysis, MM/PBSA post-processing"

  - name: scrinium/lammps
    path: .claude/skills/lammps
    description: "Classical materials simulations with LAMMPS: interatomic-potential selection, shock/deformation setups, thermodynamic runs, structure analysis"

  - name: scrinium/openfoam
    path: .claude/skills/openfoam
    description: "CFD cases with OpenFOAM: solver selection, dictionary setup, mesh workflow, turbulence-model choices, simulation verification"

  - name: scrinium/quantum-espresso
    path: .claude/skills/quantum-espresso
    description: "First-principles calculations with Quantum ESPRESSO: SCF, band structures, DOS, phonons, electron-phonon coupling, Fermi surfaces"

  - name: scrinium/scientific-runtime
    path: .claude/skills/scientific-runtime
    description: "Working protocol for scientific computing tasks: toolref-first behavior, graceful fallback under partial coverage, no doc maintenance burden on users"

  - name: scrinium/scientific-tool-onboarding
    path: .claude/skills/scientific-tool-onboarding
    description: "Add or upgrade Scrinium support for a new scientific computing tool: official docs ingestion, toolref integration, skill design, CLI verification"
