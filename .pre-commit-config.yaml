# NOTE (2026-09): GitHub is unreachable from the maintainer's network, so the
# upstream hook repos (astral-sh/ruff-pre-commit, mirrors-mypy,
# pre-commit-hooks) cannot be cloned by `pre-commit run`. All hooks are
# therefore defined as `repo: local` and call the tools installed in the
# project venv — no network bootstrap required. Tool versions follow the venv
# (single source of truth) instead of the pinned upstream revs. Restore the
# upstream repos when GitHub access is available again.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (local venv)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format (local venv)
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy scrinium/ (local venv)
        entry: .venv/bin/mypy scrinium/
        language: system
        pass_filenames: false

      - id: check-json
        name: check json
        entry: .venv/bin/python -c "import json,sys; [json.load(open(f, encoding='utf-8')) for f in sys.argv[1:]]"
        language: system
        types: [json]

      - id: check-yaml
        name: check yaml
        entry: .venv/bin/python -c "import sys,yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in sys.argv[1:]]"
        language: system
        types: [yaml]

      - id: trailing-whitespace
        name: trailing whitespace
        entry: .venv/bin/python -c "import sys; bad=[f for f in sys.argv[1:] if any(l.rstrip('\r\n')!=l.rstrip() for l in open(f, encoding='utf-8', errors='replace'))]; print('trailing whitespace:', *bad) if bad else None; sys.exit(1 if bad else 0)"
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: end of file fixer
        entry: .venv/bin/python -c "import sys; [open(f,'a',encoding='utf-8').write('\n') for f in sys.argv[1:] if open(f,'rb').read().rstrip(b'\n') and not open(f,'rb').read().endswith(b'\n')]"
        language: system
        types: [text]
