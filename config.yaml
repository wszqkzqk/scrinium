# Scrinium configuration
#
# Global config location: ~/.scrinium/config.yaml
#   (legacy ~/.scholaraio/config.yaml is still read with a migration notice)
# Legacy SCHOLARAIO_* names for SCRINIUM_* environment variables remain supported (deprecated; warns on use).

paths:
  papers_dir: data/papers # Ingested papers directory
  index_db: data/index.db # SQLite index file

# Ingest pipeline
ingest:
  mineru_endpoint: http://localhost:8000 # Local MinerU API
  mineru_cloud_url: https://mineru.net/api/v4 # `mineru-open-api --base-url` override for private deployments
  mineru_api_key: null # → config.local.yaml or env MINERU_TOKEN / MINERU_API_KEY
  mineru_backend_local: pipeline # local-only backend; keep default unless you self-host MinerU
  mineru_model_version_cloud: pipeline # `mineru-open-api extract --model`: pipeline | vlm (default pipeline; switch to vlm only when needed)
  mineru_lang: ch # keep ch for Chinese/mixed PDFs; switch to en for English-only PDFs
  mineru_parse_method: auto # auto | txt | ocr; `mineru-open-api` only maps ocr -> --ocr
  mineru_enable_formula: true # Enable formula parsing; only effective for pipeline/vlm models
  mineru_enable_table: true # Enable table parsing; only effective for pipeline/vlm models
  contact_email: null # Crossref polite pool email → config.local.yaml
  s2_api_key: null # Semantic Scholar API key → config.local.yaml or env S2_API_KEY
  openalex_api_key: null # OpenAlex API key → config.local.yaml or env OPENALEX_API_KEY
  mineru_batch_size: 20 # Cloud batch size per request (1-200, official limit)
  mineru_upload_workers: 4 # Concurrent cloud conversion tasks
  mineru_upload_retries: 3 # Cloud upload retries per file (including first attempt)
  mineru_download_retries: 3 # Cloud result download retries (legacy, kept for compatibility)
  mineru_poll_timeout: 900 # Single cloud conversion timeout (seconds)
  chunk_page_limit: 100 # Auto-split PDFs exceeding this page count
  pdf_preferred_parser: mineru # Preferred PDF parser: mineru | docling | pymupdf (MinerU by default)
  pdf_fallback_order: [auto] # Custom fallback chain, e.g. [pymupdf] or [docling,pymupdf]; auto detects installed parsers
  pdf_fallback_auto_detect: true # Enable automatic fallback detection (recommended)

search:
  top_k: 20 # FTS5 search default result count

# Logging & metrics
logging:
  level: INFO
  file: data/scrinium.log
  max_bytes: 10000000 # 10 MB, rotate on overflow
  backup_count: 3
  metrics_db: data/metrics.db

# Zotero integration
zotero:
  library_type: user # user | group
